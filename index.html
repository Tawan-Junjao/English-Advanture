<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6657e8">
<title>English Adventure V9 Complete</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
  <div><h1>🌈 English Adventure <span>V9</span></h1><p>สำหรับ iPhone / iPad</p></div>
  <div class="score">⭐ <span id="stars">0</span></div>
</header>

<section id="home" class="screen active">
  <div class="hero">
    <div class="mascot">🦁</div>
    <h2>เลือกเกม</h2>
    <p>ฝึกฟัง อ่าน และสะกดคำศัพท์ A–R</p>
  </div>
  <div class="menu">
    <button data-action="monster"><span>👾</span><b>Monster Escape</b><small>สะกดให้ทันก่อนถูกจับ</small></button>
    <button data-action="spell"><span>🔤</span><b>เรียงตัวอักษร</b><small>ฟังแล้วสะกด</small></button>
    <button data-action="picture"><span>🖼️</span><b>ดูรูปเลือกคำ</b><small>Picture Match</small></button>
    <button data-action="listen"><span>🔊</span><b>ฟังแล้วแตะ</b><small>Listen & Touch</small></button>
    <button data-action="voice"><span>🎧</span><b>ตั้งค่าเสียง Apple</b><small>ทดสอบ A–I–L</small></button>
    <button data-action="parent"><span>📊</span><b>ผลการฝึก</b><small>สำหรับผู้ปกครอง</small></button>
  </div>
</section>

<section id="game" class="screen">
  <div class="bar">
    <button class="back">← กลับ</button>
    <div id="progress"></div>
    <div class="bar-buttons">
      <button id="wordSound">🔊 อ่านคำ</button>
      <button id="spellSound">🔤 สะกด</button>
    </div>
  </div>
  <div class="game-card">
    <div id="prompt" class="prompt"></div>
    <div id="visual" class="visual"></div>

    <div id="monsterHud" class="monster-hud" hidden>
      <div class="monster-track">
        <div class="cloud c1">☁️</div><div class="cloud c2">☁️</div>
        <div id="heroChar" class="hero-char">🧒</div>
        <div id="monsterChar" class="monster-char">👾</div>
      </div>
      <div class="monster-status">
        <span id="monsterTimer">⏱️ 16</span>
        <span id="monsterLives">❤️❤️❤️</span>
      </div>
      <div class="danger-meter"><span id="dangerFill"></span></div>
    </div>

    <div id="answerArea" class="answers"></div>
    <div id="feedback" class="feedback"></div>
  </div>
</section>

<section id="voice" class="screen">
  <div class="bar"><button class="back">← กลับ</button><h2>ตั้งค่าเสียง Apple</h2><span></span></div>
  <div class="panel">
    <label>เสียงภาษาอังกฤษ<select id="voiceSelect"></select></label>
    <label>ความเร็ว<input id="voiceRate" type="range" min=".55" max="1" step=".05" value=".72"><span id="rateValue">0.72</span></label>
    <div class="voice-tests">
      <button data-test="A">▶ A</button><button data-test="I">▶ I</button><button data-test="L">▶ L</button>
    </div>
    <button id="saveVoice" class="primary">บันทึกเสียงนี้</button>
    <p id="voiceStatus" class="tip"></p>
  </div>
</section>

<section id="parent" class="screen">
  <div class="bar"><button class="back">← กลับ</button><h2>ผลการฝึก</h2><button id="reset">ล้างข้อมูล</button></div>
  <div id="summary" class="summary"></div>
  <div class="panel"><h3>คำที่ควรทบทวน</h3><div id="weakWords"></div></div>
</section>
</div>
<script src="app.js"></script>
</body>
</html>
