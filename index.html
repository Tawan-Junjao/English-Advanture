<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b5ce2"><title>English Adventure V3.2</title><link rel="manifest" href="manifest.json?v=31"><link rel="stylesheet" href="style.css?v=31"></head><body><div class="app"><header><div><h1>🌈 English Adventure <span>V3.2</span></h1><p>รู้ตัวอักษร • ฟังเสียง • สะกด • อ่านคำ</p></div><div class="right"><button id="installBtn" hidden>📲 ติดตั้ง</button><div class="score">⭐ <span id="stars">0</span></div></div></header>
